<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card hover effect</title>
    <link rel="stylesheet" href="styleCard.css">
</head>
<body>
    <div class="card">
        <img src="boy.png" alt="boy">
        <div class="data" id="boyData">
            <h3>name:rahul</h3>
            <p>job:data analytics</p>
        </div>
    </div>

    <div class="card">
        <img src="women.png" alt="women">
        <div class="data" id="womenData">
            <h3>name:women</h3>
            <p>job:software enginer</p>
        </div>
    </div>
</body>
</html>
