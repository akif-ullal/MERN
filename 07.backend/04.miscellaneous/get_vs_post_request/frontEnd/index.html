<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>get vs post request</title>
</head>
<body>
    <h1>Get request</h1>
    <form method="get" action="http://localhost:3000/registor">
        <input type="text" placeholder="user name" name="user">
        <input type="password" placeholder="password" name="password">
        <button>submit</button>
    </form>

    <br>
      <h1>post request</h1>
     <form method="post" action="http://localhost:3000/registor">
        <input type="text" placeholder="user name" name="user">
        <input type="password" placeholder="password" name="password">
        <button>submit</button>
    </form>
    
</body>
</html>
